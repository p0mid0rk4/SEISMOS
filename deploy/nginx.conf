# Пример конфигурации nginx как обратного прокси для СЕЙСМОС.
# Обеспечивает HTTPS и корректную работу WebSocket-потока /ws.

upstream seismos_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name seismos.example.ru;
    # Перенаправление на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name seismos.example.ru;

    ssl_certificate     /etc/ssl/seismos/fullchain.pem;
    ssl_certificate_key /etc/ssl/seismos/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 8m;

    location / {
        proxy_pass http://seismos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket-поток событий требует «апгрейда» соединения.
    location /ws {
        proxy_pass http://seismos_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
